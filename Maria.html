<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Match Found ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: black;
    color: white;
    overflow: hidden;
}

#loadingScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

.loadingText {
    font-size: 2em;
    color: gold;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% {opacity: 0.3;}
    50% {opacity: 1;}
    100% {opacity: 0.3;}
}

#mainContent {
    display: none;
    padding: 20px;
    background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
    height: 100vh;
}

h1 {
    font-size: 3em;
    margin-top: 40px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    background: white;
    color: #ff4e50;
    margin-top: 30px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

#message {
    margin-top: 30px;
    font-size: 1.5em;
    min-height: 80px;
}

.heart {
    position: fixed;
    color: red;
    animation: float 5s linear infinite;
}

@keyframes float {
    0% {transform: translateY(120vh);}
    100% {transform: translateY(-20vh);}
}
</style>
</head>
<body>

<div id="loadingScreen">
    <div class="loadingText">🎮 MATCH FOUND</div>
    <p>Maria 💕 & Cutie Patootie 💕</p>
</div>

<div id="mainContent">
    <h1>Maria ❤️</h1>
    <h2>From your Cutie Patootie 💕</h2>
    <p id="days"></p>
    <button id="loveBtn">Click if you love your Cutie Patootie 🙈💕</button>
    <div id="message"></div>
</div>

<audio id="bgMusic" loop>
    <source src="Love.mp3" type="audio/mpeg">
</audio>

<script>

let firstDay = new Date("2025-12-17"); 
let today = new Date();
let diff = Math.floor((today - firstDay) / (1000 * 60 * 60 * 24));

document.getElementById("days").innerHTML =
"It has been " + diff + " days since our first League voice call 🎧💕✨";

setTimeout(function(){
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("mainContent").style.display = "block";

    let audio = document.getElementById("bgMusic");
    audio.volume = 0;
    audio.play().catch(()=>{});

    let vol = 0;
    let fade = setInterval(() => {
        vol += 0.02;
        if (vol >= 1) {
            vol = 1;
            clearInterval(fade);
        }
        audio.volume = vol;
    }, 100);

}, 4000);

let messages = [
"That night we played League together… I didn’t know I was meeting my favorite person 🥺💕",
"Your voice became my favorite sound in the world 🎧💕",
"You mood swings quickly?, Still my favorite personality 🤗💕",
"Emotional, playful, soft… you're everything I never knew I needed 🥰💕",
"I didn’t just find a duo partner… I found my favorite person, my best friend, my love 🥺💕",
"Maria… I’d queue with you for the rest of my life 💕",
"No surrender vote allowed, You're stuck with me forever 😜💕♾️",
"Loading our future together... 💕"
];

let index = 0;

function showMessage() {
    if (index < messages.length) {
        document.getElementById("message").innerHTML = messages[index];
        index++;

        if (index === messages.length) {
            setTimeout(() => {
                alert("Maria… you are the best thing that ever queued into my life. 💕");
            }, 500);
        }
    } 
}

document.getElementById("loveBtn").addEventListener("click", showMessage);

function createHeart() {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 5000);
}

setInterval(createHeart, 500);

</script>

</body>
</html>
